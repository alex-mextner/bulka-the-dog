          - generic [ref=e149]:
            - paragraph [ref=e150]: Life on the streets was hard.
            - list [ref=e151]:
              - listitem [ref=e152]:
                - img [ref=e155]
                - generic [ref=e157]:
                  - generic [ref=e158]: "#1"
                  - paragraph [ref=e159]: First, a bad person once shot me with an air pistol. There's a bullet lodged near my spine. It doesn't affect my health and doesn't need to be removed unless it starts to hurt.
              - listitem [ref=e160]:
                - img [ref=e163]
                - generic [ref=e165]:
                  - generic [ref=e166]: "#2"
                  - paragraph [ref=e167]: Second, a long time ago I broke my back leg. Nobody treated me, so it healed crookedly, and sometimes after an hour of walking I start to limp. The doctor says it's no big deal, it adds to my charm!
              - listitem [ref=e168]:
                - img [ref=e171]
                - generic [ref=e175]:
                  - generic [ref=e176]: "#3"
                  - paragraph [ref=e177]: "Third, I have a heartworm living in my heart. It's at stage two right now — that's the very beginning, the worm is under one centimeter, and my heart is fully clean on ultrasound and ECG (see the report below). Lena has already started driving it out: for the next six months we visit the vet once every two weeks, pay 4000 dinars, and I get an injection plus drops. That's how the worm dies. While I'm in treatment I can't run more than 5 minutes — otherwise I cough."
              - listitem [ref=e178]:
                - img [ref=e181]
                - generic [ref=e184]:
                  - generic [ref=e185]: "#4"
                  - paragraph [ref=e186]: Fourth, I can't be spayed until we get rid of the worm. But honestly, I like the ball more than pushy male dogs anyway.
            - figure [ref=e187]:
