              - paragraph [ref=e35]: I'm somewhere around 1–2 years old, but that's not certain. The vet is sure I won't grow anymore, so you're seeing me in my prime.
              - paragraph [ref=e36]:
                - text: I was found by a girl named
                - strong [ref=e37]: Lena
                - text: from Russia, when I was begging at the Aleksandar Ski Staza restaurant in Banovo Brdo. I was feeling really terrible because I had more than
                - strong [ref=e38]: 70 ticks
                - text: on me, so Lena decided to take me in and help me.
              - paragraph [ref=e39]:
                - text: Now Lena has patched me up, taught me
                - strong [ref=e40]: all sorts of wisdom
                - text: ", and is ready to give me to good owners"
                - strong [ref=e41]: for adoption
                - text: . Lena cried while making this website, because she wants to keep me, but she has to leave Belgrade every year for the entire winter due to air quality problems. And she wants
