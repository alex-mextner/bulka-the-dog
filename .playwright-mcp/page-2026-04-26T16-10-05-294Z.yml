              - generic [ref=e91]:
                - heading "Bathroom" [level=3] [ref=e92]: 🚽 Bathroom
                - paragraph [ref=e93]: I figured out that you're supposed to go to the bathroom outside on my second day living at home, and since then I've never peed indoors.
              - generic [ref=e94]:
                - heading "Walks" [level=3] [ref=e95]: 🚶 Walks
                - paragraph [ref=e96]: "I get walked twice a day: at 10 in the morning and 10 at night. I prefer being at home, so I'm happy to do my business and head back, but I can also keep you company for the whole day and go with you to the bank, to the beauty salon, to a restaurant, or to visit friends. I'll quietly lie down next to you and sprawl out."
              - generic [ref=e97]:
                - heading "Behavior" [level=3] [ref=e98]: 🐕 Behavior
                - paragraph [ref=e99]: "I won't jump on other dogs or fight with them — I didn't find myself in a dumpster, after all. I can walk calmly both on a leash and off: I'll walk around you and sniff the flowers."
              - generic [ref=e100]:
                - heading "In the car" [level=3] [ref=e101]: 🚗 In the car
                - paragraph [ref=e102]: I can jump into the car on my own and ride calmly in the back seat. I have a superpower — I never get carsick!
              - generic [ref=e103]:
                - heading "At home" [level=3] [ref=e104]: 🏠 At home
                - paragraph [ref=e105]: At home I mostly sleep. Lena doesn't let me climb on the couch, which I of course consider discrimination. If I happen to be left alone all day, I'll just keep sleeping. I don't understand dogs who are afraid to be home alone — quite the opposite, it's great, you can enjoy the silence.
              - generic [ref=e106]:
                - heading "Food" [level=3] [ref=e107]: 🍖 Food
                - paragraph [ref=e108]: I eat dry food twice a day. And treats. I love dog pâté and cheese.
              - generic [ref=e109]:
                - heading "Living with cats" [level=3] [ref=e110]: 🐱 Living with cats
                - paragraph [ref=e111]: "Right now I live with two cats. Honestly, I don't even notice them: they just walk around, what do I care."
